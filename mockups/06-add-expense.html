<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BranchBalance — Add expense</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-page"><section class="phone"><div class="statusbar"><span>9:41</span><div class="status-icons"><span>5G</span><span class="status-dot"></span><span class="battery"></span></div></div><header class="app-header"><a class="icon-button" href="05-group-overview.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></a><div class="header-main" style="flex:1"><div class="eyebrow">Road trip 2026</div><h1 class="app-title">Add expense</h1></div><button class="icon-button" data-theme-toggle></button></header><div class="content">
  <form class="form">
    <div class="field"><label>Description</label><input class="input" value="Dinner at Nando's" placeholder="What was it for?"></div>
    <div class="field"><label>Amount</label><div class="input-row"><input class="input amount-input" value="84.00" inputmode="decimal"><select class="select"><option>EUR</option></select></div></div>
    <div class="field"><label>Paid by</label><select class="select"><option selected>Alex Kim (you)</option><option>Maya Brown</option><option>Jordan Smith</option><option>Lea Martin</option></select></div>
    <div class="field"><label>How should it be split?</label><div class="segmented" data-segment-group><button class="segment active" type="button" data-segment data-target="equal">Equal</button><button class="segment" type="button" data-segment data-target="full">Full to one</button></div></div>
    <div data-split-panel="equal"><div class="field"><label>Shared by</label><div class="check-list"><label class="check-row"><input type="checkbox" checked><span class="avatar sm">AK</span><span class="grow"><strong>Alex Kim</strong><small>€21.00 share</small></span></label><label class="check-row"><input type="checkbox" checked><span class="avatar sm green">MB</span><span class="grow"><strong>Maya Brown</strong><small>€21.00 share</small></span></label><label class="check-row"><input type="checkbox" checked><span class="avatar sm blue">JS</span><span class="grow"><strong>Jordan Smith</strong><small>€21.00 share</small></span></label><label class="check-row"><input type="checkbox" checked><span class="avatar sm gold">LM</span><span class="grow"><strong>Lea Martin</strong><small>€21.00 share</small></span></label></div></div></div>
    <div data-split-panel="full" class="hidden"><div class="field"><label>Who owes the full amount?</label><div class="check-list"><label class="check-row"><input name="full" type="radio"><span class="avatar sm green">MB</span><span class="grow"><strong>Maya Brown</strong><small>Owes €84.00</small></span></label><label class="check-row"><input name="full" type="radio" checked><span class="avatar sm blue">JS</span><span class="grow"><strong>Jordan Smith</strong><small>Owes €84.00</small></span></label><label class="check-row"><input name="full" type="radio"><span class="avatar sm gold">LM</span><span class="grow"><strong>Lea Martin</strong><small>Owes €84.00</small></span></label></div></div></div>
    <div class="field"><label>Date</label><input class="input" type="date" value="2026-07-16"></div>
    <div class="callout accent"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg><span>This expense will be stored as a new JSON file in the private group repository.</span></div>
    <a class="btn btn-primary btn-block" href="05-group-overview.html">Save expense</a>
  </form>
</div></section></main><script src="script.js"></script></body></html>
