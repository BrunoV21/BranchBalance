<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">BranchBalance app icon</title>
  <desc id="description">
    Four tiles representing euros, payments, Git branches, and balanced expenses.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="160"
      y1="140"
      x2="860"
      y2="880"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#D87564"/>
      <stop offset="1" stop-color="#A9433B"/>
    </linearGradient>
  </defs>

  <!-- Outer icon -->
  <rect
    x="72"
    y="72"
    width="880"
    height="880"
    rx="220"
    fill="url(#background)"
  />

  <!-- Inner card -->
  <rect
    x="176"
    y="176"
    width="672"
    height="672"
    rx="168"
    fill="#FFF8F0"
  />

  <!-- Tiles -->
  <rect x="270" y="286" width="188" height="202" rx="32" fill="#D87564"/>
  <rect x="492" y="286" width="262" height="202" rx="32" fill="#C96052"/>
  <rect x="270" y="522" width="262" height="220" rx="32" fill="#B94F42"/>
  <rect x="566" y="522" width="188" height="220" rx="32" fill="#E39A88"/>

  <!-- Euro -->
  <text
    x="364"
    y="428"
    fill="#FFF8F0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="126"
    font-weight="700"
    text-anchor="middle"
  >€</text>

  <!-- Credit card -->
  <g
    stroke="#FFF8F0"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="544" y="334" width="158" height="106" rx="20"/>
    <path d="M544 370H702"/>
    <path d="M574 408H614"/>
    <path d="M642 408H672"/>
  </g>

  <!-- GitHub Primer Octicons git-branch symbol -->
  <g
    fill="#FFF8F0"
    transform="translate(322 554) scale(6.6)"
  >
    <path
      d="
        M13.5 4
        A2.5 2.5 0 1 1 16.5 6.45
        V6.5
        A5 5 0 0 1 11.5 11.5
        H8.5
        V15.55
        A2.5 2.5 0 1 1 7 15.55
        V6.45
        A2.5 2.5 0 1 1 8.5 6.45
        V10
        H11.5
        A3.5 3.5 0 0 0 15 6.5
        V6.45
        A2.5 2.5 0 0 1 13.5 4
        Z

        M8 17
        A1 1 0 1 0 8 19
        A1 1 0 0 0 8 17
        Z

        M8 3
        A1 1 0 1 0 8 5
        A1 1 0 0 0 8 3
        Z

        M16 3
        A1 1 0 1 0 16 5
        A1 1 0 0 0 16 3
        Z
      "
    />
  </g>

  <!-- Balance / equality -->
  <g
    stroke="#FFF8F0"
    stroke-width="24"
    stroke-linecap="round"
  >
    <path d="M614 610H706"/>
    <path d="M614 660H706"/>
  </g>
</svg>