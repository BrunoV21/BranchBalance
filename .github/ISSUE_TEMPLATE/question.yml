name: Question
description: Ask about BranchBalance setup, usage, data ownership, or GitHub integration.
title: "Question: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please do not include access tokens, client secrets, signing credentials, private repository contents, or personal expense data.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to understand or accomplish with BranchBalance?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the app version, runtime, Android device or browser, GitHub App setup, and sanitized error output when relevant.
