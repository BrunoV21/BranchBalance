name: Private OCR quality

on:
  workflow_dispatch:
    inputs:
      operation:
        description: OCR pipeline operation
        required: true
        default: quality
        type: choice
        options:
          - quality
          - train-readiness
          - train
      profile:
        description: Profile used by readiness/training
        required: true
        default: all
        type: choice
        options:
          - all
          - generic
          - fuel
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: private-ocr-quality
  cancel-in-progress: false

jobs:
  ocr:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, branchbalance-ocr]
    timeout-minutes: 360
    env:
      OCR_DATASET_ROOT: ${{ vars.BRANCHBALANCE_OCR_DATASET_ROOT }}
      OCR_TRAINER: ${{ vars.BRANCHBALANCE_OCR_TRAINER }}
      OCR_OPERATION: ${{ inputs.operation || 'quality' }}
      OCR_PROFILE: ${{ inputs.profile || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Verify private runner boundary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$OCR_DATASET_ROOT"
          test -d "$OCR_DATASET_ROOT"
          test -f "$OCR_DATASET_ROOT/dataset.sqlite"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ocr-pipeline.txt

      - name: Install private OCR pipeline runtime
        run: python -m pip install --requirement scripts/requirements-ocr-pipeline.txt

      - name: Run fail-closed OCR pipeline
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          summary="$RUNNER_TEMP/branchbalance-ocr-summary.json"
          case "$OCR_OPERATION" in
            quality)
              python scripts/ocr-pipeline.py quality \
                --dataset "$OCR_DATASET_ROOT" \
                --summary "$summary" \
                --ci
              ;;
            train-readiness)
              python scripts/ocr-pipeline.py train-readiness \
                --dataset "$OCR_DATASET_ROOT" \
                --profile "$OCR_PROFILE" \
                --summary "$summary" \
                --ci
              ;;
            train)
              test -n "$OCR_TRAINER"
              python scripts/ocr-pipeline.py train \
                --dataset "$OCR_DATASET_ROOT" \
                --profile "$OCR_PROFILE" \
                --trainer "$OCR_TRAINER" \
                --candidate-root "$OCR_DATASET_ROOT/candidates/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --summary "$summary" \
                --ci
              ;;
            *)
              exit 2
              ;;
          esac

      # Deliberately no artifact upload: reports, predictions, annotations, and
      # candidate models remain on the dedicated private runner.
